<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OrigenChain | Trazabilidad Blockchain</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        agro: {
                            light: '#e8f5e9',
                            DEFAULT: '#2e7d32',
                            dark: '#1b5e20',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 flex h-screen overflow-hidden text-gray-800">

    <!-- Menú Lateral -->
    <aside class="w-64 bg-white border-r shadow-sm flex flex-col">
        <div class="p-6 border-b">
            <h1 class="text-2xl font-bold text-agro-dark flex items-center">
                <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
                OrigenChain
            </h1>
            <p class="text-xs text-gray-500 mt-1">Trazabilidad B2B SaaS</p>
        </div>
        <nav class="flex-1 p-4 space-y-2">
            <button onclick="showSection('resumen')" class="w-full flex items-center p-3 text-left rounded-lg hover:bg-agro-light hover:text-agro-dark transition-colors nav-btn" id="btn-resumen">
                📊 Resumen
            </button>
            <button onclick="showSection('lotes')" class="w-full flex items-center p-3 text-left rounded-lg hover:bg-agro-light hover:text-agro-dark transition-colors nav-btn" id="btn-lotes">
                📦 Listado de Lotes
            </button>
            <button onclick="showSection('registrar')" class="w-full flex items-center p-3 text-left rounded-lg bg-agro text-white hover:bg-agro-dark transition-colors nav-btn" id="btn-registrar">
                ➕ Registrar Lote
            </button>
        </nav>
        <div class="p-4 border-t text-sm text-gray-500">
            Usuario: Cooperativa
        </div>
    </aside>

    <!-- Contenido Principal -->
    <main class="flex-1 p-8 overflow-y-auto">
        
        <!-- SECCIÓN: RESUMEN -->
        <section id="section-resumen" class="hidden">
            <h2 class="text-3xl font-bold text-gray-800 mb-6">Resumen del Sistema</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="bg-white p-6 rounded-xl border shadow-sm">
                    <h3 class="text-gray-500 text-sm font-medium">Lotes Registrados</h3>
                    <p class="text-4xl font-bold text-agro-dark mt-2" id="stat-lotes">...</p>
                </div>
                <div class="bg-white p-6 rounded-xl border shadow-sm">
                    <h3 class="text-gray-500 text-sm font-medium">Bloques en la Cadena</h3>
                    <p class="text-4xl font-bold text-blue-600 mt-2" id="stat-bloques">...</p>
                </div>
                <div class="bg-white p-6 rounded-xl border shadow-sm">
                    <h3 class="text-gray-500 text-sm font-medium">Estado de la Red</h3>
                    <p class="text-xl font-bold text-green-600 mt-2 flex items-center">
                        <span class="w-3 h-3 rounded-full bg-green-500 mr-2 animate-pulse"></span>
                        <span id="stat-red">Cargando...</span>
                    </p>
                </div>
            </div>
        </section>

        <!-- SECCIÓN: LOTES -->
        <section id="section-lotes" class="hidden">
            <h2 class="text-3xl font-bold text-gray-800 mb-6">Lotes Registrados</h2>
            <div class="bg-white rounded-xl shadow-sm border overflow-hidden">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID Lote</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Producto</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Origen</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Cantidad</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Estado</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-lotes" class="bg-white divide-y divide-gray-200">
                        <!-- Los lotes se inyectarán aquí mediante JS -->
                        <tr><td colspan="5" class="px-6 py-4 text-center text-gray-500">Cargando lotes...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>

        <!-- SECCIÓN: REGISTRAR LOTE -->
        <section id="section-registrar" class="hidden">
            <h2 class="text-3xl font-bold text-gray-800 mb-6">Registrar Nuevo Lote</h2>
            <div class="bg-white p-8 rounded-xl shadow-sm border max-w-2xl">
                <form id="form-registrar" onsubmit="registrarLote(event)" class="space-y-6">
                    <div class="grid grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">ID del Lote</label>
                            <input type="text" id="input-id" required placeholder="Ej: OC-CAC-2050" class="w-full border-gray-300 rounded-lg p-2 border focus:ring-agro focus:border-agro">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Producto</label>
                            <select id="input-producto" class="w-full border-gray-300 rounded-lg p-2 border focus:ring-agro focus:border-agro">
                                <option value="Café especial">Café especial</option>
                                <option value="Cacao Fino de Aroma">Cacao Fino de Aroma</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Origen (Finca / Municipio)</label>
                        <input type="text" id="input-origen" required placeholder="Ej: Finca La Esperanza, Santander" class="w-full border-gray-300 rounded-lg p-2 border focus:ring-agro focus:border-agro">
                    </div>
                    <div class="grid grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Cantidad (Kg)</label>
                            <input type="number" id="input-cantidad" required placeholder="Ej: 250" class="w-full border-gray-300 rounded-lg p-2 border focus:ring-agro focus:border-agro">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Responsable</label>
                            <input type="text" id="input-responsable" required placeholder="Nombre del agricultor o cooperativa" class="w-full border-gray-300 rounded-lg p-2 border focus:ring-agro focus:border-agro">
                        </div>
                    </div>
                    
                    <div id="mensaje-registro" class="hidden p-4 rounded-lg text-sm font-medium"></div>

                    <button type="submit" class="w-full bg-agro hover:bg-agro-dark text-white font-bold py-3 px-4 rounded-lg transition-colors flex justify-center items-center">
                        Sellar en la Blockchain
                    </button>
                </form>
            </div>
        </section>

    </main>

    <!-- Lógica de navegación y peticiones API -->
    <script>
        // Función para cambiar entre vistas
        function showSection(sectionId) {
            // Ocultar todas las secciones
            document.querySelectorAll('main > section').forEach(sec => {
                sec.classList.add('hidden');
            });
            // Mostrar la seleccionada
            document.getElementById('section-' + sectionId).classList.remove('hidden');

            // Cargar datos según la sección
            if (sectionId === 'resumen') cargarResumen();
            if (sectionId === 'lotes') cargarLotes();
        }

        // Petición GET: Cargar Resumen
        async function cargarResumen() {
            try {
                const response = await fetch('/api/resumen');
                const data = await response.json();
                document.getElementById('stat-lotes').innerText = data.total_lotes;
                document.getElementById('stat-bloques').innerText = data.total_bloques;
                document.getElementById('stat-red').innerText = data.estado_red;
            } catch (error) {
                console.error("Error al cargar resumen:", error);
            }
        }

        // Petición GET: Cargar Lista de Lotes
        async function cargarLotes() {
            try {
                const response = await fetch('/api/lotes');
                const lotes = await response.json();
                const tbody = document.getElementById('tabla-lotes');
                tbody.innerHTML = ''; // Limpiar tabla

                if (lotes.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" class="px-6 py-4 text-center text-gray-500">No hay lotes registrados aún.</td></tr>`;
                    return;
                }

                lotes.forEach(lote => {
                    tbody.innerHTML += `
                        <tr class="hover:bg-gray-50">
                            <td class="px-6 py-4 whitespace-nowrap font-medium text-gray-900">${lote.id_lote}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-gray-600">${lote.producto}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-gray-600">${lote.origen}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-gray-600">${lote.cantidad}</td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-800">
                                    ${lote.estado}
                                </span>
                            </td>
                        </tr>
                    `;
                });
            } catch (error) {
                console.error("Error al cargar lotes:", error);
            }
        }

        // Petición POST: Registrar un nuevo lote
        async function registrarLote(event) {
            event.preventDefault(); // Evitar que la página se recargue
            
            const btnSubmit = document.querySelector('button[type="submit"]');
            const msgDiv = document.getElementById('mensaje-registro');
            btnSubmit.innerText = "Procesando bloque...";
            btnSubmit.disabled = true;

            const datos = {
                id_lote: document.getElementById('input-id').value,
                producto: document.getElementById('input-producto').value,
                origen: document.getElementById('input-origen').value,
                cantidad: document.getElementById('input-cantidad').value,
                responsable: document.getElementById('input-responsable').value
            };

            try {
                const response = await fetch('/api/lotes', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(datos)
                });

                const resultado = await response.json();

                if (response.ok) {
                    msgDiv.className = "p-4 rounded-lg text-sm font-medium bg-green-100 text-green-800 border border-green-200 block";
                    msgDiv.innerText = `¡Éxito! ${resultado.mensaje} (Bloque #${resultado.bloque_index})`;
                    document.getElementById('form-registrar').reset();
                } else {
                    throw new Error(resultado.error || 'Error desconocido');
                }
            } catch (error) {
                msgDiv.className = "p-4 rounded-lg text-sm font-medium bg-red-100 text-red-800 border border-red-200 block";
                msgDiv.innerText = "Error: " + error.message;
            } finally {
                btnSubmit.innerText = "Sellar en la Blockchain";
                btnSubmit.disabled = false;
                
                // Ocultar mensaje después de 4 segundos
                setTimeout(() => { msgDiv.classList.add('hidden'); }, 4000);
            }
        }

        // Inicializar mostrando el resumen al cargar la página
        window.onload = () => showSection('resumen');
    </script>
</body>
</html>
